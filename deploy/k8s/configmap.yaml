apiVersion: v1
kind: ConfigMap
metadata:
  name: android-tv-relay
  labels:
    app.kubernetes.io/name: android-tv-relay
data:
  # name=address pairs, comma-separated. Port defaults to 5555.
  TVS: "committee=192.168.1.50:5555,lobby=192.168.1.51:5555"
  HTTP_ADDR: ":8080"
  TCP_ADDR: ":8700"
  ADB_KEY_PATH: "/data/adbkey"
  ADB_KEY_NAME: "android-tv-relay"
