# Persist the ADB key so the TV does not re-prompt "Allow debugging" on every
# pod restart. Generate a key once, approve it on each TV, then store it here.
#
#   # generate a key locally (writes ./adbkey and ./adbkey.pub)
#   docker run --rm -v "$PWD:/data" ghcr.io/shiham-dev/android-tv-relay -pubkey
#
#   # create the Secret from the generated private key
#   kubectl create secret generic android-tv-relay-key --from-file=adbkey=./adbkey
#
# This example uses a placeholder; prefer `kubectl create secret` over committing
# a real key to Git.
apiVersion: v1
kind: Secret
metadata:
  name: android-tv-relay-key
  labels:
    app.kubernetes.io/name: android-tv-relay
type: Opaque
stringData:
  adbkey: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_ADB_PRIVATE_KEY
    -----END PRIVATE KEY-----
