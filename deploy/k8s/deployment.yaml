apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-tv-relay
  labels:
    app.kubernetes.io/name: android-tv-relay
spec:
  # Keep a single replica: adbd accepts one client connection per TV at a time,
  # so multiple replicas would contend for the same TVs.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: android-tv-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: android-tv-relay
    spec:
      # The pod must be able to reach the TVs on your LAN (TCP 5555). Depending
      # on your cluster's networking you may need hostNetwork: true, or routes
      # from the pod network to the TV subnet.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: relay
          image: ghcr.io/shiham-dev/android-tv-relay:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: android-tv-relay
          ports:
            - name: http
              containerPort: 8080
            - name: tcp
              containerPort: 8700
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: adbkey
              mountPath: /data
              readOnly: true
      volumes:
        - name: adbkey
          secret:
            secretName: android-tv-relay-key
            items:
              - key: adbkey
                path: adbkey
