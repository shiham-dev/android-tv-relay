apiVersion: v1
kind: Service
metadata:
  name: android-tv-relay
  labels:
    app.kubernetes.io/name: android-tv-relay
spec:
  # LoadBalancer gives the control system (e.g. Crestron) a stable address to
  # reach the TCP line protocol on 8700. Use NodePort or ClusterIP if preferred.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: android-tv-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: tcp
      port: 8700
      targetPort: tcp
